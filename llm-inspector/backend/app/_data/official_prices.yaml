# Official per-vendor pricing for the LLM Inspector v17 price-evidence layer.
#
# Schema (each entry):
#   model_id            — canonical id used at the public API layer
#   vendor              — openai|anthropic|google|xai|deepseek|mistral|moonshot|...
#   input_per_mtok_usd  — USD per 1,000,000 prompt tokens (USD/Mtok)
#   output_per_mtok_usd — USD per 1,000,000 completion tokens
#   cache_read_per_mtok_usd — optional, vendors that bill cache reads
#   last_synced_at      — ISO-8601 UTC timestamp of last manual / API sync
#   source_url          — vendor's pricing page (must be live at sync time)
#
# Phase 3 ships a static seed scraped 2026-04-27 from each vendor's pricing
# page.  Phase 6 (model_registry_sync) will overwrite this file every 6h
# from OpenRouter's /api/v1/models endpoint, preserving manual entries that
# OpenRouter does not yet carry.
#
# Provenance: every record's source_url is registered in
# _data/SOURCES.yaml under the key `pricing.<model_id>`.

